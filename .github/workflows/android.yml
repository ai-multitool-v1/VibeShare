name: Android CI

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest test --continue --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/reports/tests/debug/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Run lint
        run: ./gradlew lint --stacktrace

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            **/build/reports/lint-results-debug.html
            **/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: vibeshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Signed release (tag)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ test, lint, build ]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (cached)
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          VIBESHARE_KEYSTORE_BASE64: ${{ secrets.VIBESHARE_KEYSTORE_BASE64 }}
          VIBESHARE_KEYSTORE_PASSWORD: ${{ secrets.VIBESHARE_KEYSTORE_PASSWORD }}
          VIBESHARE_KEY_ALIAS: ${{ secrets.VIBESHARE_KEY_ALIAS }}
          VIBESHARE_KEY_PASSWORD: ${{ secrets.VIBESHARE_KEY_PASSWORD }}
        run: |
          if [ -z "$VIBESHARE_KEYSTORE_BASE64" ]; then
            echo "::warning::Signing secrets missing - release will fall back to debug signing (NOT shippable)"
          fi

      - name: Build signed release APK + AAB
        env:
          VIBESHARE_KEYSTORE_BASE64: ${{ secrets.VIBESHARE_KEYSTORE_BASE64 }}
          VIBESHARE_KEYSTORE_PASSWORD: ${{ secrets.VIBESHARE_KEYSTORE_PASSWORD }}
          VIBESHARE_KEY_ALIAS: ${{ secrets.VIBESHARE_KEY_ALIAS }}
          VIBESHARE_KEY_PASSWORD: ${{ secrets.VIBESHARE_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease bundleRelease --stacktrace
          ls -la app/build/outputs/apk/release/ app/build/outputs/bundle/release/

      - name: Generate checksums
        run: |
          cd app/build/outputs
          find . -name "*.apk" -o -name "*.aab" | xargs sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vibeshare-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
